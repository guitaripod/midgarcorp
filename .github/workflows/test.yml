name: CI Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Build ct CLI
      run: make build

    - name: Install dependencies
      run: npm ci

    - name: Run linting and tests in parallel
      run: |
        npx tsc --noEmit & tsc_pid=$!
        npx prettier --check "src/**/*.{js,ts,astro,css}" & prettier_pid=$!
        npm run test:run & test_pid=$!
        status=0
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt violations:"
          echo "$unformatted"
          status=1
        fi
        wait "$tsc_pid" || status=1
        wait "$prettier_pid" || status=1
        wait "$test_pid" || status=1
        exit "$status"

    - name: Build project
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build

  deploy-preview:
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Install dependencies and build ct CLI in parallel
      run: |
        npm ci & npm_pid=$!
        make build & make_pid=$!
        wait "$npm_pid"
        wait "$make_pid"

    - name: Build project
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build

    - name: Deploy to Cloudflare Pages Preview
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist --project-name=midgarcorp --commit-dirty=true

  deploy-production:
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: success() && github.ref == 'refs/heads/master' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)

    permissions:
      contents: read
      deployments: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Install dependencies and build ct CLI in parallel
      run: |
        npm ci & npm_pid=$!
        make build & make_pid=$!
        wait "$npm_pid"
        wait "$make_pid"

    - name: Build project
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build

    - name: Deploy to Cloudflare Pages Production
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist --project-name=midgarcorp --branch=master --commit-dirty=true
