name: Sync GitHub release versions

# Keeps landing-facts.json versions for GitHub-distributed apps (githubUrl set)
# matched to each repo's latest release, so page footers can never drift from
# what is actually released. Text-only change, committed directly.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Sync versions
      run: python3 scripts/sync-github-versions.py

    - name: Commit and push if changed
      run: |
        if git diff --quiet; then
          echo "No version changes"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add src/data/landing-facts.json
        git commit -m "Sync app versions with latest GitHub releases"
        git push
